name: Electron packages and rendering
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: bazel-contrib/setup-bazel@4fd964a13a440a8aeb0be47350db2fc640f19ca8 # 0.15.0
      - name: Test packaging and Electron's patched Node loop
        run: bazel test //tests:package_test //source:loop_interrupt_test
      - name: Build native embedder JavaScript generator
        run: bazel build //source:embedder_javascript
      - name: Cross-compile patched libuv, Windows uses MSVC
        run: >-
          bazel build //source:cross_probes
          --repo_env=BAZEL_MSVC_RUNTIME_VISUAL_STUDIO_EULA=1
          --repo_env=BAZEL_WINDOWS_SDK_EULA=1
      - name: Cross-package example for all five platforms
        shell: bash
        run: |
          bazel build //examples/hello:dist
          mkdir artifacts
          while IFS= read -r archive; do
            cp "$archive" artifacts/
          done < <(bazel cquery //examples/hello:dist --output=files)
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: electron-linux_amd64
          path: artifacts/dist_linux_amd64.zip
          if-no-files-found: error
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: electron-linux_arm64
          path: artifacts/dist_linux_arm64.zip
          if-no-files-found: error
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: electron-darwin_arm64
          path: artifacts/dist_darwin_arm64.zip
          if-no-files-found: error
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: electron-windows_amd64
          path: artifacts/dist_windows_amd64.zip
          if-no-files-found: error
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: electron-windows_arm64
          path: artifacts/dist_windows_arm64.zip
          if-no-files-found: error

  smoke:
    needs: build
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux_amd64
            runner: ubuntu-24.04
          - platform: linux_arm64
            runner: ubuntu-24.04-arm
          - platform: darwin_arm64
            runner: macos-15
          - platform: windows_amd64
            runner: windows-2022
          - platform: windows_arm64
            runner: windows-11-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: electron-${{ matrix.platform }}
          path: artifact
      - name: Install Linux display and runtime
        if: runner.os == 'Linux'
        run: >-
          sudo apt-get update && sudo apt-get install -y
          xvfb xauth libgtk-3-0t64 libasound2t64 libgbm1 libnss3
      - name: Exercise downloaded app and rendering
        shell: bash
        env:
          TARGET_PLATFORM: ${{ matrix.platform }}
        run: |
          if [[ "$RUNNER_OS" == Linux ]]; then
            xvfb-run -a python tools/smoke.py --package="artifact/dist_$TARGET_PLATFORM.zip" --screenshot=render.png
          else
            python tools/smoke.py --package="artifact/dist_$TARGET_PLATFORM.zip" --screenshot=render.png
          fi
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: rendering-${{ matrix.platform }}
          path: render.png
          if-no-files-found: warn
